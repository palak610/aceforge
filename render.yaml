services:
  # Option 1: Render Web Service (Universal Vite Preview Host)
  - type: web
    name: aceforge-arena
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production

  # Option 2: Render Static Site (Edge Static CDN)
  - type: static
    name: aceforge-arena-static
    buildCommand: npm install && npm run build
    staticPublishPath: .output/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
